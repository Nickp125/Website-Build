<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav__container">
          <div class="logo">
              <img class="logo__img" src="./data-forwarding-concept.png" />
              <h1 class="title__logo">Movie Search<br>Made Easy!</h1>
          </div>
          <div class="links">
            <div class="nav__links">
                <a class="nav__link" href="#">Home</a>
                <a class="nav__link" href="#">Movies</a>
                <a class="nav__link" href="#">Contact</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <section id="landing-page">
      <div class="landing__content">
        <h1 class="landing__title">Welcome to Movie Search!</h1>
        <h2 class="landing__subtitle">America's #1 Movie Database</h2>
        <h3 class="landing__description">Find your favorite movies easily.</h3>
        <div class="search__container">
          <label class="search__label">Search for a movie:</label>
          <input class="search__input" type="text" placeholder="Avengers: Endgame" />
          <button class="search__button">Search</button>
        </div>
      </div>
    </section>
  </body>
</html>
